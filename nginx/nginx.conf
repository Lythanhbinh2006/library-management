# Nginx reverse proxy cho Library App
# Chạy bằng image nginx-unprivileged (user nginx, UID 101) nên lắng nghe cổng 8080/8443;
# docker-compose ánh xạ 80->8080 và 443->8443.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;                       # ẩn phiên bản Nginx
    sendfile      on;
    keepalive_timeout 30s;
    client_max_body_size 1m;                 # ứng dụng chỉ nhận form nhỏ
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # Chạy non-root -> mọi thư mục tạm đặt ở /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Access log dạng JSON để Loki/LogQL phân tích bằng `| json`
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
        '"host":"$host","referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;


    upstream library_app {
        server app:3000;
        keepalive 16;
    }

    # ---- HTTP (8080): chuyển hướng sang HTTPS ----
    server {
        listen 8080;
        server_name _;

        location = /nginx-health {           # dùng cho Docker healthcheck
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS (8443): reverse proxy tới ứng dụng ----
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers (xem snippets/security-headers.conf)
        include /etc/nginx/snippets/security-headers.conf;


        # Chỉ cho phép các method mà ứng dụng dùng
        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
        }

        # Endpoint số liệu Prometheus chỉ dành cho mạng nội bộ, không public ra Internet
        location = /metrics {
            return 404;
        }

        location = /login {
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://library_app;
        }

        location / {
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://library_app;
        }
    }

    # ---- stub_status (8081): chỉ trong mạng monitor_net, cho nginx-prometheus-exporter ----
    server {
        listen 8081;
        server_name _;
        access_log off;

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        location = /stub_status {
            stub_status;
        }
        location / {
            return 404;
        }
    }
}
