apiVersion: 1
groups:
  - orgId: 1
    name: library-platform
    folder: Library
    interval: 1m
    rules:
      - uid: library-overdue
        title: Nhiều sách quá hạn
        condition: overdue
        data:
          - refId: overdue
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: library_loans_overdue > 10
              instant: true
              refId: overdue
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Số phiếu quá hạn đang cao
        labels:
          severity: warning
      - uid: library-target-down
        title: Target giám sát bị down
        condition: down
        data:
          - refId: down
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up == 0
              instant: true
              refId: down
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Một target Prometheus không hoạt động
        labels:
          severity: critical
