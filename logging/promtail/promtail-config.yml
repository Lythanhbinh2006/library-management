# Promtail: phát hiện container qua Docker API, chỉ lấy container thuộc project "library",
# gắn nhãn service/container rồi đẩy log sang Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=library"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      # Log của ứng dụng là JSON -> lấy "level" làm nhãn (ít giá trị, an toàn cho Loki)
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
